services:
  axonserver:
    image: 'axoniq/axonserver:latest'
    container_name: axon
    environment:
      - 'AXONIQ_AXONSERVER_STANDALONE=TRUE'
    ports:
      - '8024:8024'
      - '8124:8124'
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: es_account_db
      POSTGRES_USER: axon
      POSTGRES_PASSWORD: axon
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: